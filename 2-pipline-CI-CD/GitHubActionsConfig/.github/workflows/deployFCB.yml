name: Deploy fcb

on:
  push:
    branches:
      - main

jobs:
  build-and-deployFCB:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.1
       
      - name: Set up Node.js
        uses: actions/setup-node@v4.1.1
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
    
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/app-fbc:node . 

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/app-fbc:node-node
      
      - name: Checkout CD repo
        uses: actions/checkout@v4.1.1
        with:
          repository: Danidred/front-cha-base
          token: ${{ secrets.GH_PAT }}
          path: FrontChaBase

      - name: Deploy to Kubernetes
        run : |
          cd FrontChaBase/k8s
          sed -i 's|image:.*|image: '"${{ secrets.DOCKER_USERNAME }}/app-fbc:node"'|g' k8s/deployment.yaml

      - name: Commit and push files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update Deployment Image to ${{ secrets.DOCKER_USERNAME }}/app-fbc:node"
          git push